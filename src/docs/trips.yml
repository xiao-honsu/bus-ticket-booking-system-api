paths:
  # ============================================
  # TRIPS API - Search & Details
  # ============================================

  /v1/trips/search:
    get:
      summary: Search trips with advanced filtering
      description: |
        **Use Case: Main Trip Search Page**
        
        This is the primary endpoint for the search results page. It supports comprehensive filtering, sorting, and pagination.
        
        **Frontend Implementation Flow:**
        1. User fills search form (origin, destination, date)
        2. User clicks "Search" → Call this API
        3. Display results in a list/grid
        4. User applies filters → Re-call API with filter params
        5. User changes sort → Re-call API with sortBy/sortOrder
        6. User clicks pagination → Re-call API with page param
        
        **Search Form Fields:**
        - Origin (required for meaningful results) - Use autocomplete from `/locations/search`
        - Destination (required for meaningful results) - Use autocomplete from `/locations/search`
        - Departure Date (recommended)
        
        **Filter Panel Fields:**
        - Price Range: minPrice, maxPrice (VND)
        - Departure Time: departureTimeFrom, departureTimeTo (HH:mm format)
        - Bus Type: standard, limousine, sleeper
        - Amenities: wifi, aircon, usb, blanket, toilet, etc.
        
        **Sort Options:**
        - `departureTime` - Earliest first (default)
        - `price` - Cheapest first
        - `duration` - Shortest trip first
        - `availableSeats` - Most available seats first
        
        **Pagination:**
        - Default: 10 results per page
        - Max: 50 results per page
        
        **Example URL:**
        ```
        GET /v1/trips/search?origin=Hồ Chí Minh&destination=Đà Lạt&departureDate=2025-12-15&minPrice=200000&maxPrice=500000&busType=limousine&sortBy=price&sortOrder=asc&page=1&limit=10
        ```
      tags:
        - Trips
      parameters:
        # Location filters
        - name: origin
          in: query
          required: false
          description: |
            Origin city name (case-insensitive, partial match supported)
            Example: "Hồ Chí Minh", "HCM", "Sài Gòn"
          schema:
            type: string
          example: "Hồ Chí Minh"
        - name: destination
          in: query
          required: false
          description: |
            Destination city name (case-insensitive, partial match supported)
            Example: "Đà Lạt", "Da Lat"
          schema:
            type: string
          example: "Đà Lạt"
        
        # Date filter
        - name: departureDate
          in: query
          required: false
          description: |
            Departure date in ISO 8601 format (YYYY-MM-DD)
            Only trips departing on this date will be returned
          schema:
            type: string
            format: date
          example: "2025-12-15"
        
        # Price filters
        - name: minPrice
          in: query
          required: false
          description: Minimum price per seat in VND
          schema:
            type: number
            minimum: 0
          example: 200000
        - name: maxPrice
          in: query
          required: false
          description: Maximum price per seat in VND (must be >= minPrice)
          schema:
            type: number
            minimum: 0
          example: 500000
        
        # Time filters
        - name: departureTimeFrom
          in: query
          required: false
          description: |
            Earliest departure time (HH:mm format, 24-hour)
            Example: "06:00" for 6 AM, "18:00" for 6 PM
          schema:
            type: string
            pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "06:00"
        - name: departureTimeTo
          in: query
          required: false
          description: |
            Latest departure time (HH:mm format, 24-hour)
            Example: "12:00" for noon, "23:59" for end of day
          schema:
            type: string
            pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "18:00"
        
        # Bus filters
        - name: busType
          in: query
          required: false
          description: |
            Filter by bus type:
            - `standard`: Regular seats, budget-friendly
            - `limousine`: Luxury seats, extra legroom
            - `sleeper`: Sleeper beds for overnight trips
          schema:
            type: string
            enum: [standard, limousine, sleeper]
          example: "limousine"
        - name: amenities
          in: query
          required: false
          description: |
            Filter by amenities (multiple values supported)
            Common amenities: wifi, aircon, usb, blanket, toilet, tv, water
            
            **Query format:** `amenities=wifi&amenities=aircon` or `amenities=wifi,aircon`
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: ["wifi", "aircon"]
        
        # Operator filter
        - name: operatorId
          in: query
          required: false
          description: Filter by specific bus operator ID
          schema:
            type: string
          example: "507f1f77bcf86cd799439013"
        
        # Sorting
        - name: sortBy
          in: query
          required: false
          description: |
            Field to sort results by:
            - `departureTime`: Sort by departure time (default)
            - `price`: Sort by ticket price
            - `duration`: Sort by trip duration
            - `availableSeats`: Sort by number of available seats
          schema:
            type: string
            enum: [price, departureTime, duration, availableSeats]
            default: departureTime
        - name: sortOrder
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        
        # Pagination
        - name: page
          in: query
          required: false
          description: Page number (1-indexed)
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      
      responses:
        '200':
          description: Paginated list of trips matching search criteria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSearchResponse'
              example:
                results:
                  - _id: "507f1f77bcf86cd799439014"
                    departureTime: "2025-12-15T08:00:00.000Z"
                    arrivalTime: "2025-12-15T15:00:00.000Z"
                    pricePerSeat: 250000
                    availableSeats: 25
                    availableSeatsCount: 25
                    status: "scheduled"
                    route:
                      id: "507f1f77bcf86cd799439011"
                      routeName: "Sài Gòn - Đà Lạt"
                      origin:
                        city: "Hồ Chí Minh"
                        state: "Hồ Chí Minh"
                        landmark: "Bến xe Miền Đông"
                      destination:
                        city: "Đà Lạt"
                        state: "Lâm Đồng"
                        landmark: "Bến xe Đà Lạt"
                      distance: 308
                      estimatedDuration: 420
                    bus:
                      id: "507f1f77bcf86cd799439012"
                      busNumber: "BUS-001"
                      busType: "limousine"
                      amenities: ["wifi", "aircon", "usb", "blanket"]
                      totalSeats: 40
                    operator:
                      id: "507f1f77bcf86cd799439013"
                      companyName: "Phương Trang"
                      logoUrl: "https://example.com/logo.png"
                      rating:
                        overall: 4.5
                        totalReviews: 1234
                page: 1
                limit: 10
                totalPages: 5
                totalResults: 48
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidDate:
                  summary: Invalid date format
                  value:
                    code: 400
                    message: "\"departureDate\" must be a valid date"
                invalidPrice:
                  summary: Invalid price range
                  value:
                    code: 400
                    message: "\"maxPrice\" must be greater than or equal to minPrice"

  /v1/trips/{tripId}:
    get:
      summary: Get basic trip information
      description: |
        **Use Case: Quick Trip Preview**
        
        Get basic trip information without seat availability details.
        Use this for trip cards or quick previews.
        
        For full details including seat map, use `/v1/trips/{tripId}/details` instead.
      tags:
        - Trips
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip ID (MongoDB ObjectId)
          schema:
            type: string
          example: "507f1f77bcf86cd799439014"
      responses:
        '200':
          description: Trip information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripSearchResult'
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Trip not found"

  /v1/trips/{tripId}/details:
    get:
      summary: Get detailed trip information with seat availability
      description: |
        **Use Case: Trip Details & Seat Selection Page**
        
        This endpoint returns comprehensive trip information including real-time seat availability.
        Use this when the user clicks on a trip to view details and select seats.
        
        **Frontend Implementation Flow:**
        1. User clicks on a trip from search results
        2. Navigate to trip details page
        3. Call this API to get full details
        4. Display trip info + seat map
        5. Allow seat selection from available seats
        
        **Seat Status:**
        - `available`: Can be selected by user
        - `booked`: Already purchased, show as disabled
        - `locked`: Temporarily held by another user (expires in ~10 mins)
        
        **Seat Map Rendering:**
        ```
        Front of Bus
        ┌─────────────────────┐
        │  [A1] [A2]   [A3] [A4]  │
        │  [B1] [B2]   [B3] [B4]  │
        │  [C1] [C2]   [C3] [C4]  │
        │       ...              │
        └─────────────────────┘
        
        Legend: 🟢 Available  🔴 Booked  🟡 Locked
        ```
        
        **Price Calculation:**
        Each seat has a base price (pricePerSeat) plus optional priceModifier.
        Total = pricePerSeat + priceModifier
      tags:
        - Trips
      parameters:
        - name: tripId
          in: path
          required: true
          description: Trip ID (MongoDB ObjectId)
          schema:
            type: string
          example: "507f1f77bcf86cd799439014"
      responses:
        '200':
          description: Detailed trip information with seat availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetails'
              example:
                _id: "507f1f77bcf86cd799439014"
                id: "507f1f77bcf86cd799439014"
                departureTime: "2025-12-15T08:00:00.000Z"
                arrivalTime: "2025-12-15T15:00:00.000Z"
                pricePerSeat: 250000
                availableSeats: 25
                status: "scheduled"
                route:
                  id: "507f1f77bcf86cd799439011"
                  routeName: "Sài Gòn - Đà Lạt"
                  origin:
                    city: "Hồ Chí Minh"
                    state: "Hồ Chí Minh"
                    landmark: "Bến xe Miền Đông"
                  destination:
                    city: "Đà Lạt"
                    state: "Lâm Đồng"
                    landmark: "Bến xe Đà Lạt"
                  distance: 308
                  estimatedDuration: 420
                  stops:
                    - city: "Bảo Lộc"
                      state: "Lâm Đồng"
                      stopOrder: 1
                      minutesFromStart: 180
                bus:
                  id: "507f1f77bcf86cd799439012"
                  busNumber: "BUS-001"
                  busType: "limousine"
                  amenities: ["wifi", "aircon", "usb", "blanket"]
                  totalSeats: 40
                  images: ["https://example.com/bus1.jpg"]
                operator:
                  id: "507f1f77bcf86cd799439013"
                  companyName: "Phương Trang"
                  logoUrl: "https://example.com/logo.png"
                  rating:
                    overall: 4.5
                    totalReviews: 1234
                  description: "Nhà xe uy tín hàng đầu Việt Nam"
                seatAvailability:
                  A1:
                    seatNumber: "A1"
                    row: 1
                    column: 1
                    seatType: "window"
                    status: "available"
                    price: 250000
                    priceModifier: 0
                  A2:
                    seatNumber: "A2"
                    row: 1
                    column: 2
                    seatType: "aisle"
                    status: "booked"
                    price: 250000
                    priceModifier: 0
                  A3:
                    seatNumber: "A3"
                    row: 1
                    column: 3
                    seatType: "aisle"
                    status: "locked"
                    price: 250000
                    priceModifier: 0
                  A4:
                    seatNumber: "A4"
                    row: 1
                    column: 4
                    seatType: "window"
                    status: "available"
                    price: 270000
                    priceModifier: 20000
                policies:
                  cancellation: "Free cancellation up to 24 hours before departure"
                  modification: "Free modification up to 12 hours before departure"
                  refund: "Full refund for cancellations made 24+ hours before departure"
        '404':
          description: Trip not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 404
                message: "Trip not found"
